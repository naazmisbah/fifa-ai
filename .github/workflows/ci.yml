name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Lint · typecheck · coverage · build
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs so the workflow cannot be
      # altered by a moved tag.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build
