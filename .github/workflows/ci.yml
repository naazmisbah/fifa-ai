name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Lint · typecheck · coverage · build
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs so the workflow cannot be
      # altered by a moved tag.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build
